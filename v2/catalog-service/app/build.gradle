plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':domain')
    implementation project(':infra')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.yaml:snakeyaml'
    implementation 'org.apache.commons:commons-collections4:4.4' // 한 번도 사용하지 않은 선언 (HIGH)
    implementation 'com.google.protobuf:protobuf-java:4.34.2' // 상품 protobuf 내보내기 기능 삭제 후 잔류 (HIGH)
    implementation 'com.depgov.common:common-util:1.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // DECLARED_ONLY: 테스트 전용
}

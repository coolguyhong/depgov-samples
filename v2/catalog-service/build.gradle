plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.depgov.sample.v2'
    version = '1.0.0'

    // S10 고정 버전. 의존성 선언에서는 Boot 관리 좌표의 버전을 생략한다.
    ext['snakeyaml.version'] = '2.6'
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    repositories {
        mavenCentral()
        maven {
            url 'https://raw.githubusercontent.com/coolguyhong/depgov-samples/main/v2/maven-repo'
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'sample.root', rootProject.projectDir.absolutePath
    }
}

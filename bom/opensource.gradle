// 오픈소스 표준 버전. depgov가 읽는 기준(BOM 저장소). 표본은 platform()으로 쓰지 않는다.
dependencies {
    constraints {
        api 'org.apache.commons:commons-lang3:3.17.0'
        api 'org.apache.commons:commons-text:1.12.0'
        api 'org.apache.commons:commons-csv:1.11.0'
        api 'com.google.guava:guava:33.4.0-jre'
        api 'com.google.code.findbugs:jsr305:3.0.2'
        api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
        api 'com.fasterxml.jackson.core:jackson-core:2.18.2'
        api 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
        api 'org.slf4j:slf4j-api:2.0.16'
        api 'org.apache.lucene:lucene-core:9.11.1'
        api 'org.apache.httpcomponents.core5:httpcore5:5.3.1'
        api 'com.google.code.gson:gson:2.11.0'            // 어느 표본도 안 씀 (BOM 기준 미사용 후보 1)
    }
}
